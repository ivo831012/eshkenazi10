<!DOCTYPE html>
<html lang="bg"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A3A33">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ешкенази 10">
<title>Ешкенази 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: the monthly notice ("poster") is the page; a piggy-bank button opens a side sheet with the form, payments and history */
:root {
  --bg: #E7EFEC;
  --bg2: #D5E6E0;
  --surface: #FFFFFF;
  --ink: #12302B;
  --muted: #5E7570;
  --line: #D8E3E0;
  --field: #F1F6F4;
  --accent: #0E6B5E;
  --accent-soft: #DDEFEA;
  --good: #1F8A55;
  --good-soft: #DDF3E6;
  --bad: #C2412D;
  --bad-soft: #FBE3DE;
  --scrim: rgba(8, 30, 26, .45);
  /* poster: one fixed look in both themes */
  --p-deep: #0A3A33;
  --p-mid: #0F6B5E;
  --p-paper: #F7FBFA;
  --p-ink: #12302B;
  --p-mute: #5E7570;
  --p-light: #CFE7E1;
  --p-amber: #F2A93B;
  --p-amber-ink: #2A1B05;
  --p-green: #4CD38E;
  --p-red: #FF8A73;
  --display: "Unbounded", "Manrope", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B1715; --bg2: #10302B; --surface: #14272A; --ink: #E6F1EE; --muted: #93AAA5; --line: #24403D; --field: #0F2023;
  --accent: #3FC1A8; --accent-soft: #173A36; --good: #5BD394; --good-soft: #163A2A; --bad: #F07A64; --bad-soft: #3D211C;
  --scrim: rgba(0, 0, 0, .6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B1715; --bg2: #10302B; --surface: #14272A; --ink: #E6F1EE; --muted: #93AAA5; --line: #24403D; --field: #0F2023;
  --accent: #3FC1A8; --accent-soft: #173A36; --good: #5BD394; --good-soft: #163A2A; --bad: #F07A64; --bad-soft: #3D211C;
  --scrim: rgba(0, 0, 0, .6); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: radial-gradient(1200px 600px at 80% -10%, var(--bg2), transparent 60%), var(--bg); background-color: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; overflow-x: hidden; }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 2.5px solid var(--p-amber); outline-offset: 2px; }

.stage { max-width: 600px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }

/* ---------- poster ---------- */
.poster { position: relative; overflow: hidden; border-radius: 28px; color: #fff; padding: 26px 22px 22px;
  background: linear-gradient(155deg, var(--p-deep) 0%, var(--p-mid) 100%);
  box-shadow: 0 30px 60px -30px rgba(6, 40, 34, .7), 0 2px 0 rgba(255,255,255,.04) inset;
  display: flex; flex-direction: column; gap: 18px; animation: rise .7s cubic-bezier(.2,.8,.2,1) both; }
.blob { position: absolute; border-radius: 50%; pointer-events: none; filter: blur(2px); }
.b1 { width: 340px; height: 340px; right: -120px; top: -150px; background: radial-gradient(circle, rgba(242,169,59,.28), transparent 65%); animation: float 12s ease-in-out infinite; }
.b2 { width: 260px; height: 260px; left: -120px; bottom: 120px; background: radial-gradient(circle, rgba(76,211,142,.16), transparent 65%); animation: float 15s ease-in-out infinite reverse; }
.poster > *:not(.blob) { position: relative; }

.ptop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.peyebrow { color: var(--p-amber); font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.poster h1 { font-family: var(--display); font-size: clamp(30px, 8.5vw, 44px); line-height: 1.02; margin: 6px 0 10px; letter-spacing: -.01em; }
.pmonth { display: inline-flex; align-items: center; gap: 2px; background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px; }
.pmonth button { width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; color: #fff; font-size: 18px; font-weight: 700; line-height: 1; transition: background .2s; }
.pmonth button:hover { background: rgba(255,255,255,.15); }
.pmonth span { font-weight: 800; padding: 0 8px; min-width: 128px; text-align: center; font-size: 14px; }

.piggy { flex: none; width: 58px; height: 58px; border: 0; border-radius: 18px; background: var(--p-amber); color: var(--p-amber-ink);
  display: grid; place-items: center; box-shadow: 0 10px 24px -10px rgba(242,169,59,.9); transition: transform .25s cubic-bezier(.3,1.6,.5,1); }
.piggy svg { width: 36px; height: 36px; }
.piggy:hover { transform: translateY(-2px) rotate(-6deg); }
.piggy:active { transform: scale(.94); }
.piggy.wiggle { animation: wiggle .7s ease; }
.piggy .coin { transform-box: fill-box; transform-origin: center; animation: coin 3.2s ease-in-out infinite; }

.bills { background: var(--p-paper); color: var(--p-ink); border-radius: 20px; padding: 6px 18px; }
.bill { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1.5px dashed #DCE6E3; }
.bill:last-child { border-bottom: 0; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.bill .nm { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.bill .nm small { display: block; color: var(--p-mute); font-weight: 600; font-size: 12px; }
.bill .am { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bill.wait .am { color: var(--p-mute); font-weight: 600; font-size: 13px; background: #EAF1EF; padding: 2px 10px; border-radius: 999px; }
.enter .bill { animation: slideIn .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 60ms + 120ms); }

.ptiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pt { border-radius: 20px; padding: 14px 16px; min-width: 0; }
.pt small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.pt .v { font-family: var(--display); font-weight: 700; font-size: clamp(20px, 6vw, 30px); font-variant-numeric: tabular-nums; white-space: nowrap; margin-top: 4px; }
.pt .s { font-size: 12px; font-weight: 600; }
.pt.total { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.1); }
.pt.total small, .pt.total .s { color: var(--p-light); }
.pt.per { background: var(--p-amber); color: var(--p-amber-ink); box-shadow: 0 14px 28px -16px rgba(242,169,59,.9); }
.pt.per small, .pt.per .s { opacity: .78; }

.phead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.phead b { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--p-light); }
.phead span { font-weight: 800; font-size: 14px; }
.pbar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; margin-top: -8px; }
.pbar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--p-green), #A6F0C6); transition: width .8s cubic-bezier(.2,.8,.2,1); }

.papts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.ap { border-radius: 16px; padding: 10px 10px 11px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,138,115,.45); transition: background .35s, border-color .35s; }
.ap .n { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; }
.ap .n b { font-family: var(--display); font-size: 20px; line-height: 1; }
.ap .n small { color: var(--p-light); font-size: 11px; font-weight: 700; }
.ap .st { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 800; color: var(--p-red); white-space: nowrap; }
.ap .st svg { width: 14px; height: 14px; flex: none; }
.ap.paid { background: rgba(76,211,142,.18); border-color: rgba(76,211,142,.7); }
.ap.paid .st { color: var(--p-green); }
.ap.pop { animation: pop .55s cubic-bezier(.3,1.6,.5,1); }
.ap.paid .chk path { stroke-dasharray: 20; stroke-dashoffset: 0; }
.ap.pop.paid .chk path { animation: draw .5s .1s ease both; }
.enter .ap { animation: popIn .45s cubic-bezier(.3,1.5,.5,1) both; animation-delay: calc(var(--i) * 50ms + 300ms); }

.pfoot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; color: var(--p-light); font-size: 12px; font-weight: 600; opacity: .8; }

.below { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 800; background: var(--surface); color: var(--ink); box-shadow: 0 1px 0 var(--line), 0 10px 22px -16px rgba(0,0,0,.35); display: inline-flex; align-items: center; gap: 8px; transition: transform .2s; }
.btn:hover { transform: translateY(-1px); }
.btn svg { width: 18px; height: 18px; }
.status { font-size: 12px; color: var(--muted); font-weight: 600; }
.imgout { display: flex; flex-direction: column; gap: 8px; }
.imgout img { border-radius: 18px; }
.imgout p { margin: 0; font-size: 12px; color: var(--muted); }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 30; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--surface); color: var(--ink);
  display: flex; flex-direction: column; box-shadow: -30px 0 60px -30px rgba(0,0,0,.45);
  transform: translateX(105%); transition: transform .42s cubic-bezier(.2,.85,.2,1); border-radius: 26px 0 0 26px;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.sheet.open { transform: none; }
.shead { padding: 18px 20px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--line); }
.shead .r { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.shead h2 { font-family: var(--display); font-size: 20px; margin: 0; font-weight: 700; }
.x { width: 38px; height: 38px; border: 0; border-radius: 12px; background: var(--field); font-size: 22px; line-height: 1; transition: transform .2s; }
.x:hover { transform: rotate(90deg); }
.smonth { display: flex; align-items: center; justify-content: space-between; background: var(--field); border-radius: 14px; padding: 4px; }
.smonth button { width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; font-size: 18px; font-weight: 800; }
.smonth button:hover { background: var(--accent-soft); }
.smonth strong { font-weight: 800; }
.tabs { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--field); border-radius: 14px; padding: 4px; }
.tabs button { position: relative; z-index: 1; border: 0; background: transparent; padding: 8px 4px; border-radius: 10px; font-weight: 800; font-size: 14px; color: var(--muted); transition: color .25s; }
.tabs button[aria-selected="true"] { color: var(--ink); }
.tabs .ind { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3); border-radius: 10px; background: var(--surface); box-shadow: 0 2px 8px -3px rgba(0,0,0,.25); transition: transform .35s cubic-bezier(.3,1.3,.5,1); }
.sbody { flex: 1; overflow-y: auto; padding: 8px 20px 24px; overscroll-behavior: contain; }
.pane { animation: fadeUp .35s ease both; }

.row { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; padding: 13px 0; border-bottom: 1px dashed var(--line); }
.label { min-width: 0; }
.label b { display: block; font-weight: 700; }
.label em { font-style: normal; font-size: 12px; color: var(--muted); }
input { font: inherit; color: var(--ink); background: var(--field); border: 1.5px solid transparent; border-radius: 12px; padding: 9px 11px; min-width: 0; transition: border-color .2s, background .2s; }
input:focus { border-color: var(--accent); background: var(--surface); outline: none; }
.label input { width: 100%; font-weight: 700; }
.amt { display: flex; align-items: center; gap: 6px; }
.money { position: relative; }
.money input { width: 110px; text-align: right; padding-right: 26px; font-variant-numeric: tabular-nums; font-weight: 800; }
.money::after { content: "€"; position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 700; pointer-events: none; }
.qty input { width: 46px; text-align: center; font-weight: 800; }
.times { color: var(--muted); font-weight: 800; }
.del { border: 0; background: transparent; color: var(--muted); width: 32px; height: 32px; border-radius: 10px; font-size: 20px; line-height: 1; }
.del:hover { color: var(--bad); background: var(--bad-soft); }
.add { margin-top: 14px; width: 100%; border: 1.5px dashed var(--accent); color: var(--accent); background: transparent; border-radius: 14px; padding: 11px; font-weight: 800; transition: background .2s; }
.add:hover { background: var(--accent-soft); }
.ssum { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0 0; font-weight: 800; }
.ssum span:last-child { font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.newrow { animation: fadeUp .35s ease both; }

.prow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.prow b { font-weight: 800; }
.prow small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
.switch { position: relative; flex: none; width: 128px; height: 38px; border: 0; border-radius: 999px; background: var(--bad-soft); color: var(--bad); font-weight: 800; font-size: 13px; padding: 0 12px 0 40px; text-align: left; transition: background .3s, color .3s, padding .3s; }
.switch::before { content: ""; position: absolute; left: 5px; top: 5px; width: 28px; height: 28px; border-radius: 50%; background: var(--bad); transition: transform .35s cubic-bezier(.3,1.5,.5,1), background .3s; }
.switch[aria-checked="true"] { background: var(--good-soft); color: var(--good); padding: 0 40px 0 14px; }
.switch[aria-checked="true"]::before { transform: translateX(90px); background: var(--good); }
.allpaid { margin-top: 14px; display: flex; gap: 8px; }
.allpaid button { flex: 1; border: 1.5px solid var(--line); background: transparent; border-radius: 12px; padding: 9px; font-weight: 700; font-size: 13px; }
.allpaid button:hover { border-color: var(--accent); }

.hrow { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px; margin-top: 6px; border: 0; background: var(--field); border-radius: 14px; text-align: left; transition: transform .2s, background .2s; }
.hrow:hover { transform: translateX(-3px); background: var(--accent-soft); }
.hrow.cur { box-shadow: inset 0 0 0 2px var(--accent); }
.hrow b { font-weight: 800; }
.hrow .num { font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.hrow small { color: var(--muted); font-size: 12px; font-weight: 600; }
.hbar { grid-column: 1 / -1; height: 6px; border-radius: 9px; background: var(--line); overflow: hidden; }
.hbar i { display: block; height: 100%; background: var(--good); border-radius: 9px; }
.empty { color: var(--muted); padding: 16px 0; margin: 0; }

@keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.98); } to { opacity: 1; transform: none; } }
@keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-30px, 24px); } }
@keyframes slideIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
@keyframes popIn { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes draw { from { stroke-dashoffset: 20; } to { stroke-dashoffset: 0; } }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-14deg); } 40% { transform: rotate(10deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(3deg); } }
@keyframes coin { 0%, 55% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(5px); opacity: 0; } 71% { transform: translateY(-6px); opacity: 0; } 90%,100% { transform: translateY(0); opacity: 1; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

@media (max-width: 520px) {
  .papts { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
  .ap { padding: 8px 7px 9px; border-radius: 13px; }
  .ap .n small { display: none; }
  .ap .st { font-size: 10px; gap: 3px; letter-spacing: -.01em; }
  .ap .st svg { display: none; }
  .sheet { top: auto; height: 92%; width: 100%; border-radius: 26px 26px 0 0; transform: translateY(105%); padding-right: 0;
    padding-left: env(safe-area-inset-left, 0px); }
  .sheet.open { transform: none; }
  .shead { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .sbody { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .shead::before { content: ""; width: 40px; height: 5px; border-radius: 9px; background: var(--line); align-self: center; margin-top: -6px; }
}
@media (max-width: 360px) { .ap .st { font-size: 9px; } .papts { gap: 5px; } .ap { padding: 7px 5px 8px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
[hidden] { display: none !important; }

.pin { position: fixed; z-index: 40; left: 50%; top: 50%; width: min(340px, calc(100% - 32px)); transform: translate(-50%, -46%) scale(.96); opacity: 0; pointer-events: none;
  background: var(--surface); color: var(--ink); border-radius: 24px; padding: 22px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.5);
  display: flex; flex-direction: column; gap: 12px; transition: opacity .25s, transform .3s cubic-bezier(.3,1.4,.5,1); }
.pin.open { opacity: 1; transform: translate(-50%, -50%); pointer-events: auto; }
.pin h3 { margin: 0; font-family: var(--display); font-size: 18px; }
.pin p { margin: 0; font-size: 13px; color: var(--muted); }
.pin input { font-size: 15px; letter-spacing: 0; text-align: center; font-weight: 800; padding: 12px; }
.pin .err { color: var(--bad); font-weight: 700; min-height: 1.2em; }
.pin.shake { animation: shake .4s; }
.pin .go { border: 0; border-radius: 14px; padding: 12px; font-weight: 800; background: var(--p-amber); color: var(--p-amber-ink); }
@keyframes shake { 0%,100% { margin-left: 0; } 25% { margin-left: -10px; } 75% { margin-left: 10px; } }
</style>
</head><body>

<main class="stage">
  <article class="poster" id="poster" aria-label="Месечни разходи">
    <div class="blob b1"></div><div class="blob b2"></div>
    <div class="ptop">
      <div>
        <div class="peyebrow">Месечни разходи</div>
        <h1>Ешкенази 10</h1>
        <div class="pmonth">
          <button id="pprev" type="button" aria-label="Предишен месец">‹</button>
          <span id="mlabel">—</span>
          <button id="pnext" type="button" aria-label="Следващ месец">›</button>
        </div>
      </div>
      <button class="piggy" id="piggy" type="button" aria-label="Попълни сметките и плащанията" title="Попълни">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <circle class="coin" cx="20" cy="6" r="4" fill="currentColor"/>
          <path fill="currentColor" d="M8 22c0-6.1 5.6-10 13-10 4.2 0 7.6 1.2 9.7 3.3l3.3-1.3-.6 4.4c.8.9 1.4 1.9 1.7 3h1.9v5.2h-2.4c-.9 1.6-2.3 2.9-4 3.8V34h-4.4l-.6-2.4c-1 .2-2 .3-3.1.3-1 0-2-.1-2.9-.2L19 34h-4.4v-3.6C10.6 28.6 8 25.6 8 22z"/>
          <rect x="16" y="15.4" width="8" height="2" rx="1" fill="#F2A93B"/>
          <circle cx="28.5" cy="20.5" r="1.5" fill="#F2A93B"/>
          <path d="M8.4 21.5c-2 0-3.2-1-3.4-2.6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="bills" id="bills"></div>

    <div class="ptiles">
      <div class="pt total"><small>Общо</small><div class="v" id="vTotal">0,00 €</div><div class="s" id="vCount">—</div></div>
      <div class="pt per"><small>На апартамент</small><div class="v" id="vPer">0,00 €</div><div class="s">общото ÷ 7</div></div>
    </div>

    <div class="phead"><b>Плащания</b><span id="vPaid">0 от 7 платени</span></div>
    <div class="pbar"><i id="vBar"></i></div>
    <div class="papts" id="papts"></div>

    <div class="pfoot"><span id="vLeft">—</span><span id="vUpd"></span></div>
  </article>

  <div class="below">
    <button class="btn" id="install" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg>
      Инсталирай като приложение
    </button>
    <span class="status" id="status">Зарежда…</span>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<form class="pin" id="pin" role="dialog" aria-modal="true" aria-labelledby="pintitle" inert>
  <h3 id="pintitle">Ключ за попълване</h3>
  <p>Само домоуправителят може да попълва сметки и плащания. Постави ключа си от GitHub. Телефонът ще го запомни.</p>
  <input id="pinval" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…" aria-label="Ключ от GitHub">
  <span class="err" id="pinerr"></span>
  <button class="go" type="submit" id="pingo">Отключи</button>
</form>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="stitle" inert>
  <div class="shead">
    <div class="r"><h2 id="stitle">Попълване</h2><button class="x" id="close" type="button" aria-label="Затвори">×</button></div>
    <div class="smonth">
      <button id="sprev" type="button" aria-label="Предишен месец">‹</button>
      <strong id="slabel">—</strong>
      <button id="snext" type="button" aria-label="Следващ месец">›</button>
    </div>
    <div class="tabs" role="tablist">
      <span class="ind" id="ind"></span>
      <button type="button" role="tab" aria-selected="true" data-tab="0">Сметки</button>
      <button type="button" role="tab" aria-selected="false" data-tab="1">Плащания</button>
      <button type="button" role="tab" aria-selected="false" data-tab="2">История</button>
    </div>
  </div>
  <div class="sbody" id="sbody">
    <div class="pane" data-pane="0">
      <div id="rows"></div>
      <button class="add" id="add" type="button">+ Добави разход</button>
      <div class="ssum"><span>Общо</span><span id="ssum">0,00 €</span></div>
    </div>
    <div class="pane" data-pane="1" hidden>
      <div id="prows"></div>
      <div class="allpaid"><button id="allOn" type="button">Всички платени</button><button id="allOff" type="button">Изчисти отметките</button></div>
    </div>
    <div class="pane" data-pane="2" hidden>
      <div id="hist"></div>
    </div>
  </div>
</aside>

<script>
const MONTHS = ["Януари","Февруари","Март","Април","Май","Юни","Юли","Август","Септември","Октомври","Ноември","Декември"];
const N = 7;
const BASE = [
  { id: "clean", name: "Почистване", fixed: true, hasQty: true, qty: 2, price: 30 },
  { id: "lift", name: "Асансьор", fixed: true, qty: 1, price: 60 },
  { id: "power", name: "Ток (общи части)", fixed: true, qty: 1, price: "" },
  { id: "liftpower", name: "Ток асансьор", fixed: true, qty: 1, price: "" },
  { id: "other", name: "Други", fixed: false, qty: 1, price: "" }
];
const KEEP = ["clean", "lift"];
const DOTS = ["#0E6B5E", "#F2A93B", "#3FA7C1", "#E2725B", "#7A6FD0", "#5BAF6E", "#D4669B"];
const CHECK = `<svg class="chk" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="currentColor" opacity=".2"/><path d="M4.5 8.3l2.2 2.2 4.8-4.9" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const CROSS = `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.5" fill="currentColor" opacity=".2"/><path d="M5.6 5.6l4.8 4.8M10.4 5.6l-4.8 4.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;

const num = v => { const n = parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : 0; };
const fmt = n => n.toLocaleString("bg-BG", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const line = r => (r.hasQty ? num(r.qty) : 1) * num(r.price);
const keyOf = (y, m) => `${y}-${String(m + 1).padStart(2, "0")}`;
const parse = k => { const [y, m] = k.split("-").map(Number); return { y, m: m - 1 }; };
const label = k => { const { y, m } = parse(k); return `${MONTHS[m]} ${y}`; };
const shift = (k, d) => { const { y, m } = parse(k); const t = new Date(y, m + d, 1); return keyOf(t.getFullYear(), t.getMonth()); };
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);

const today = new Date();
let cur = keyOf(today.getFullYear(), today.getMonth());
const months = {}, drafts = {}, dirty = {};
let tab = 0, lastPaid = {};

const totalOf = mo => mo.items.reduce((s, r) => s + line(r), 0);
const paidN = mo => Object.keys(mo.paid || {}).filter(k => mo.paid[k]).length;
function defaultsFor(k) {
  const prevKeys = Object.keys(months).filter(x => x < k).sort();
  const prev = prevKeys.length ? months[prevKeys[prevKeys.length - 1]] : null;
  let items = clone(BASE);
  if (prev) items = items.map(b => { const p = prev.items.find(i => i.id === b.id); return p && KEEP.includes(b.id) ? { ...b, qty: p.qty, price: p.price } : b; });
  return { items, paid: {} };
}
const month = (k = cur) => months[k] || (drafts[k] ||= defaultsFor(k));

/* ---------- storage ---------- */
const OWNER = "ivo831012", REPO = "eshkenazi10", FILE = "data.json";
const GH = `https://api.github.com/repos/${OWNER}/${REPO}`;
const b64 = str => { const bytes = new TextEncoder().encode(str); let bin = ""; bytes.forEach(x => bin += String.fromCharCode(x)); return btoa(bin); };
const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));
const ghHeaders = tok => Object.assign({ Accept: "application/vnd.github+json" }, tok ? { Authorization: "Bearer " + tok } : {});
async function readRemote(tok) {
  const r = await fetch(`${GH}/contents/${FILE}?t=${Date.now()}`, { headers: ghHeaders(tok), cache: "no-store" });
  if (r.status === 404) return { data: { months: {} }, sha: null };
  if (r.ok) { const j = await r.json(); return { data: JSON.parse(unb64(j.content) || "{}"), sha: j.sha }; }
  // over the hourly limit for visitors: fall back to the public copy (may be a few minutes old)
  const raw = await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${FILE}?t=${Date.now()}`, { cache: "no-store" });
  if (raw.status === 404) return { data: { months: {} }, sha: null };
  if (!raw.ok) throw new Error("read");
  return { data: await raw.json(), sha: null };
}
async function call(fn, ...args) {
  if (fn === "getAll") { const { data } = await readRemote(pin || null); return JSON.stringify(data.months || {}); }
  if (fn === "checkPin") {
    const r = await fetch(GH, { headers: ghHeaders(args[0]) });
    if (!r.ok) return false;
    const j = await r.json(); return !!(j.permissions && j.permissions.push);
  }
  if (fn === "saveMonth") {
    const [tok, key, json] = args;
    for (let attempt = 0; attempt < 2; attempt++) {
      const { data, sha } = await readRemote(tok);
      data.months = data.months || {};
      data.months[key] = JSON.parse(json);
      const body = { message: `${label(key)}: обновяване`, content: b64(JSON.stringify(data, null, 1)) };
      if (sha) body.sha = sha;
      const r = await fetch(`${GH}/contents/${FILE}`, { method: "PUT", headers: ghHeaders(tok), body: JSON.stringify(body) });
      if (r.ok) return true;
      if (r.status === 401 || r.status === 403 || r.status === 404) throw new Error("PIN");
      if (r.status !== 409 && r.status !== 422) throw new Error("save");
    }
    throw new Error("save");
  }
}
let pin = "";
try { pin = localStorage.getItem("eshkenazi10-pin") || ""; } catch (e) {}
const timers = {};
let chain = Promise.resolve();
const setStatus = t => { $("status").textContent = t; };
function persist(k, delay = 1500) {
  if (!months[k]) { months[k] = drafts[k]; delete drafts[k]; }
  dirty[k] = true;
  months[k].updated = new Date().toISOString();
  clearTimeout(timers[k]);
  setStatus("Записва се…");
  timers[k] = setTimeout(() => {
    delete timers[k];
    const body = clone(months[k]);
    chain = chain.then(async () => {
      await call("saveMonth", pin, k, JSON.stringify(body));
      setStatus("Записано");
    }).catch(err => setStatus(String(err && err.message || err).includes("PIN") ? "Ключът не важи. Отвори касичката и постави нов ключ." : "Не се записа. Провери връзката и опитай пак."))
      .finally(() => { if (!timers[k]) dirty[k] = false; });
  }, delay);
}

/* ---------- number animation ---------- */
function countTo(el, to) {
  const from = el._v ?? 0; el._v = to;
  if (reduced || Math.abs(to - from) < .005) { el.textContent = fmt(to); return; }
  const t0 = performance.now(), d = 650;
  cancelAnimationFrame(el._raf);
  const step = t => { const p = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(from + (to - from) * e); if (p < 1) el._raf = requestAnimationFrame(step); };
  el._raf = requestAnimationFrame(step);
}

/* ---------- poster ---------- */
function renderPoster(animate) {
  const mo = month(), t = totalOf(mo), per = t / N, p = paidN(mo);
  $("mlabel").textContent = label(cur);
  const bills = $("bills");
  const shown = mo.items.filter(r => line(r) > 0 || r.fixed);
  bills.innerHTML = shown.map((r, i) => {
    const has = line(r) > 0;
    const sub = r.hasQty && has && num(r.qty) !== 1 ? `<small>${num(r.qty)} × ${fmt(num(r.price))}</small>` : "";
    return `<div class="bill${has ? "" : " wait"}" style="--i:${i}"><span class="dot" style="background:${DOTS[i % DOTS.length]}"></span>
      <span class="nm">${esc(r.name || "Други")}${sub}</span><span class="am">${has ? fmt(line(r)) : "очаква се"}</span></div>`;
  }).join("");
  const filled = mo.items.filter(r => line(r) > 0).length;
  countTo($("vTotal"), t); countTo($("vPer"), per);
  $("vCount").textContent = filled === 1 ? "1 сметка" : `${filled} сметки`;
  $("vPaid").textContent = `${p} от ${N} платени`;
  $("vBar").style.width = (p / N * 100) + "%";
  $("vLeft").textContent = p === N ? "Всички са платили. Благодарим!" : `Остава да се съберат ${fmt(per * (N - p))}`;
  $("vUpd").textContent = mo.updated ? "Обновено " + new Date(mo.updated).toLocaleDateString("bg-BG") : "";

  const prev = lastPaid[cur] || {};
  $("papts").innerHTML = Array.from({ length: N }, (_, i) => {
    const a = i + 1, paid = !!(mo.paid && mo.paid[a]);
    const changed = !animate && prev[a] !== undefined && prev[a] !== paid;
    return `<div class="ap${paid ? " paid" : ""}${changed ? " pop" : ""}" style="--i:${i}">
      <div class="n"><b>${a}</b><small>ап.</small></div>
      <div class="st">${paid ? CHECK : CROSS}<span>${paid ? "Платено" : "Неплатено"}</span></div></div>`;
  }).join("");
  lastPaid[cur] = Object.fromEntries(Array.from({ length: N }, (_, i) => [i + 1, !!(mo.paid && mo.paid[i + 1])]));

  if (animate) { const pz = $("poster"); pz.classList.remove("enter"); void pz.offsetWidth; pz.classList.add("enter"); }
}

/* ---------- sheet ---------- */
function renderSheet() {
  $("slabel").textContent = label(cur);
  renderRows(); renderPay(); renderHist();
}
function renderRows(newId) {
  const mo = month(), box = $("rows");
  box.innerHTML = "";
  mo.items.forEach(r => {
    const el = document.createElement("div");
    el.className = "row" + (r.id === newId ? " newrow" : "");
    const lab = r.fixed
      ? `<div class="label"><b>${esc(r.name)}</b>${r.hasQty ? `<em class="calc"></em>` : ""}</div>`
      : `<div class="label"><input id="n-${r.id}" value="${esc(r.name)}" aria-label="Описание на разхода" placeholder="Описание"></div>`;
    el.innerHTML = lab + `<div class="amt">
      ${r.hasQty ? `<label class="qty"><input id="q-${r.id}" type="text" inputmode="numeric" value="${esc(r.qty)}" aria-label="Брой пъти"></label><span class="times">×</span>` : ""}
      <label class="money"><input id="p-${r.id}" type="text" inputmode="decimal" value="${esc(r.price)}" placeholder="0,00" aria-label="Сума за ${esc(r.name)}"></label>
      ${!r.fixed ? `<button class="del" type="button" aria-label="Премахни реда">×</button>` : ""}</div>`;
    box.appendChild(el);
    const calc = () => { const c = el.querySelector(".calc"); if (c) c.textContent = `${num(r.qty)} пъти × ${fmt(num(r.price))} = ${fmt(line(r))}`; };
    calc();
    const changed = () => { persist(cur); renderPoster(false); $("ssum").textContent = fmt(totalOf(month())); renderPay(); renderHist(); };
    el.querySelector(`#p-${r.id}`).addEventListener("input", e => { r.price = e.target.value; calc(); changed(); });
    const q = el.querySelector(`#q-${r.id}`); if (q) q.addEventListener("input", e => { r.qty = e.target.value; calc(); changed(); });
    const n = el.querySelector(`#n-${r.id}`); if (n) n.addEventListener("input", e => { r.name = e.target.value; changed(); });
    const d = el.querySelector(".del");
    if (d) d.addEventListener("click", () => { mo.items.splice(mo.items.indexOf(r), 1); persist(cur, 0); renderRows(); renderPoster(false); renderHist(); });
  });
  $("ssum").textContent = fmt(totalOf(mo));
}
function renderPay() {
  const mo = month(), per = totalOf(mo) / N, box = $("prows");
  box.innerHTML = "";
  for (let a = 1; a <= N; a++) {
    const when = mo.paid && mo.paid[a];
    const el = document.createElement("div");
    el.className = "prow";
    el.innerHTML = `<div><b>Апартамент ${a}</b><small>${fmt(per)}${when ? " · платено на " + new Date(when).toLocaleDateString("bg-BG") : ""}</small></div>
      <button class="switch" type="button" role="switch" aria-checked="${when ? "true" : "false"}" aria-label="Апартамент ${a} е платил">${when ? "Платено" : "Неплатено"}</button>`;
    el.querySelector("button").addEventListener("click", () => setPaid([a], !when));
    box.appendChild(el);
  }
}
function setPaid(list, on) {
  const mo = month(); mo.paid = mo.paid || {};
  const stamp = new Date().toISOString().slice(0, 10);
  let any = false;
  list.forEach(a => { if (on && !mo.paid[a]) { mo.paid[a] = stamp; any = true; } if (!on && mo.paid[a]) { delete mo.paid[a]; any = true; } });
  if (!any) return;
  persist(cur, 0); renderPay(); renderPoster(false); renderHist();
  if (on) { const pg = $("piggy"); pg.classList.remove("wiggle"); void pg.offsetWidth; pg.classList.add("wiggle"); }
}
function renderHist() {
  const keys = Object.keys(months).sort().reverse(), box = $("hist");
  if (!keys.length) { box.innerHTML = `<p class="empty">Още няма запазени месеци. Месецът се записва, щом въведеш сума или отметнеш плащане.</p>`; return; }
  box.innerHTML = "";
  keys.forEach(k => {
    const mo = months[k], t = totalOf(mo), p = paidN(mo);
    const b = document.createElement("button");
    b.type = "button"; b.className = "hrow" + (k === cur ? " cur" : "");
    b.innerHTML = `<span><b>${label(k)}</b><small> · платили ${p} от ${N}</small></span><span class="num">${fmt(t)}<small> · ${fmt(t / N)} на ап.</small></span><span class="hbar"><i style="width:${p / N * 100}%"></i></span>`;
    b.addEventListener("click", () => goMonth(k, true));
    box.appendChild(b);
  });
}
function goMonth(k, toBills) {
  cur = k;
  renderPoster(true); renderSheet();
  if (toBills) setTab(0);
}

const sheet = $("sheet"), scrim = $("scrim");
function openSheet() { renderSheet(); sheet.inert = false; sheet.classList.add("open"); scrim.classList.add("open"); setTimeout(() => $("close").focus(), 50); }
function closeSheet() { sheet.classList.remove("open"); scrim.classList.remove("open"); sheet.inert = true; $("piggy").focus(); }
function setTab(i) {
  tab = i;
  document.querySelectorAll(".tabs [role=tab]").forEach(b => b.setAttribute("aria-selected", String(+b.dataset.tab === i)));
  document.querySelectorAll(".pane").forEach(p => p.hidden = +p.dataset.pane !== i);
  $("ind").style.transform = `translateX(${i * 100}%)`;
}
document.querySelectorAll(".tabs [role=tab]").forEach(b => b.addEventListener("click", () => setTab(+b.dataset.tab)));
const pinBox = $("pin");
function askPin() {
  pinBox.inert = false; pinBox.classList.add("open"); scrim.classList.add("open");
  $("pinerr").textContent = ""; $("pinval").value = ""; setTimeout(() => $("pinval").focus(), 60);
}
function closePin() { pinBox.classList.remove("open"); pinBox.inert = true; if (!sheet.classList.contains("open")) scrim.classList.remove("open"); }
pinBox.addEventListener("submit", async e => {
  e.preventDefault();
  const v = $("pinval").value.trim();
  $("pingo").disabled = true; $("pinerr").textContent = "Проверява…";
  let ok = false;
  try { ok = await call("checkPin", v); } catch (err) { $("pinerr").textContent = "Няма връзка. Опитай пак."; $("pingo").disabled = false; return; }
  $("pingo").disabled = false;
  if (!ok) { $("pinerr").textContent = "Този ключ не дава достъп до таблото"; pinBox.classList.remove("shake"); void pinBox.offsetWidth; pinBox.classList.add("shake"); return; }
  pin = v; try { localStorage.setItem("eshkenazi10-pin", v); } catch (err) {}
  closePin(); openSheet();
});
$("piggy").addEventListener("click", async () => {
  if (!pin) return askPin();
  let ok = false; try { ok = await call("checkPin", pin); } catch (e) { ok = true; }
  if (ok) openSheet(); else { pin = ""; askPin(); }
});
$("close").addEventListener("click", closeSheet);
scrim.addEventListener("click", () => { if (pinBox.classList.contains("open")) closePin(); else closeSheet(); });
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (pinBox.classList.contains("open")) closePin(); else if (sheet.classList.contains("open")) closeSheet(); });
$("pprev").addEventListener("click", () => goMonth(shift(cur, -1)));
$("pnext").addEventListener("click", () => goMonth(shift(cur, 1)));
$("sprev").addEventListener("click", () => goMonth(shift(cur, -1)));
$("snext").addEventListener("click", () => goMonth(shift(cur, 1)));
$("allOn").addEventListener("click", () => setPaid([1,2,3,4,5,6,7], true));
$("allOff").addEventListener("click", () => setPaid([1,2,3,4,5,6,7], false));
$("add").addEventListener("click", () => {
  const id = "o" + Date.now().toString(36);
  month().items.push({ id, name: "Други", fixed: false, qty: 1, price: "" });
  persist(cur, 0); renderRows(id);
  const inp = $("n-" + id); if (inp) { inp.focus(); inp.select(); }
});

/* ---------- boot ---------- */
renderPoster(true);
setTab(0);
let first = true;
async function load() {
  if (document.hidden || sheet.classList.contains("open") || Object.values(dirty).some(Boolean)) return;
  try {
    const all = JSON.parse(await call("getAll"));
    if (sheet.classList.contains("open") || Object.values(dirty).some(Boolean)) return;
    for (const k in months) if (!all[k]) delete months[k];
    for (const k in all) { months[k] = all[k]; delete drafts[k]; }
    renderPoster(first); first = false; renderSheet();
    setStatus(Object.keys(all).length ? "Актуално" : "Още няма въведени месеци");
  } catch (e) { setStatus("Няма връзка. Опитай пак след малко."); }
}
setStatus("Зарежда…");
load();
setInterval(load, 180000);

/* ---------- install as app ---------- */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("install").hidden = false; });
window.addEventListener("appinstalled", () => { $("install").hidden = true; installEvt = null; });
$("install").addEventListener("click", async () => {
  if (!installEvt) return;
  installEvt.prompt();
  try { await installEvt.userChoice; } catch (e) {}
  installEvt = null; $("install").hidden = true;
});
document.addEventListener("visibilitychange", load);
</script>
</body></html>
